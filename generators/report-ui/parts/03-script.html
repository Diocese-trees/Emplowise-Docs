<script>
(function () {
  "use strict";

  /* ---------- helpers ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (n, a, b) { return Math.max(a, Math.min(b, n)); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var pkr = function (n) { return "PKR " + Math.round(n).toLocaleString("en-GB"); };
  var num = function (n) { return Math.round(n).toLocaleString("en-GB"); };
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function toDate(iso) {
    if (!iso) return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    if (!m) return null;
    return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  }
  function isoOf(d) {
    return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");
  }
  function addMonths(iso, n) {
    var d = toDate(iso);
    var day = d.getUTCDate();
    d.setUTCDate(1);
    d.setUTCMonth(d.getUTCMonth() + n);
    var last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
    d.setUTCDate(Math.min(day, last));
    return isoOf(d);
  }
  function monthsBetween(fromIso, toIso) {
    var a = toDate(fromIso), b = toDate(toIso);
    if (!a || !b) return null;
    var whole = (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + (b.getUTCMonth() - a.getUTCMonth());
    var frac = (b.getUTCDate() - a.getUTCDate()) / 30.44;
    return Math.max(0, Math.round((whole + frac) * 10) / 10);
  }
  function prettyDate(iso) {
    var d = toDate(iso);
    if (!d) return "Never";
    return d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear();
  }

  var FIELDS = ["employee_id", "name", "role", "department", "salary", "start_date", "contract_status",
    "notice_period_weeks", "performance_score", "last_review_date", "manager_id", "risk_flags"];
  var STATUSES = ["permanent", "probation", "contract", "verbal"];
  var STATUS_LABEL = { permanent: "Permanent", probation: "Probation", contract: "Fixed term", verbal: "Verbal" };
  var HUES = ["#0d9488", "#0891b2", "#4f46e5", "#7c3aed", "#d946ef", "#e11d48", "#f59e0b", "#10b981"];

  /* ---------- seeded fictional register ---------- */
  var SEED = [
    ["E001", "Bilal Ahmed", "Chief executive", "Leadership", 350000, "2018-03-01", "permanent", 4, 72, "2026-05-20", "", ""],
    ["E002", "Hina Raza", "HR generalist", "People", 95000, "2024-02-12", "permanent", 4, 74, "2026-09-10", "E001", ""],
    ["E003", "Kamran Sheikh", "Senior salesperson", "Sales", 85000, "2025-04-07", "permanent", 2, 38, "", "E001", "commission_on_signature;no_quota"],
    ["E004", "Ayesha Malik", "Lead designer", "Design", 140000, "2022-06-01", "permanent", 4, 82, "2025-09-15", "E001", "scope_requests_unanswered;pay_flat_24m"],
    ["E005", "Danish Iqbal", "Sales lead", "Sales", 70000, "2024-11-04", "permanent", 1, 45, "", "E003", "promotion_without_criteria"],
    ["E006", "Sana Javed", "Designer", "Design", 80000, "2026-04-20", "probation", 2, 58, "", "E004", "probation_overrun"],
    ["E007", "Usman Tariq", "Designer", "Design", 75000, "2026-08-03", "verbal", 0, 41, "", "E004", "referral_hire;no_work_sample"],
    ["E008", "Fatima Noor", "Account manager", "Accounts", 110000, "2023-01-16", "permanent", 4, 78, "2026-08-12", "E001", ""],
    ["E009", "Zeeshan Ali", "Performance marketer", "Marketing", 95000, "2024-07-01", "permanent", 4, 69, "2026-06-30", "E008", ""],
    ["E010", "Maryam Shah", "Content lead", "Content", 90000, "2023-09-11", "permanent", 4, 71, "2026-07-22", "E008", ""],
    ["E011", "Hamza Aslam", "Video editor", "Content", 65000, "2025-10-06", "contract", 2, 63, "2026-05-05", "E010", ""],
    ["E012", "Rabia Khan", "Copywriter", "Content", 55000, "2026-02-02", "verbal", 0, 66, "", "E010", "no_written_terms"],
    ["E013", "Ahmed Raza", "Sales executive", "Sales", 55000, "2026-01-19", "permanent", 1, 52, "", "E005", "short_notice"],
    ["E014", "Bilquees Bano", "Office administrator", "People", 45000, "2021-05-10", "verbal", 0, 68, "", "E002", "no_written_terms"],
    ["E015", "Saad Munir", "Web developer", "Technology", 120000, "2023-03-20", "permanent", 4, 76, "2026-09-01", "E001", ""],
    ["E016", "Nimra Yousaf", "QA analyst", "Technology", 70000, "2025-06-16", "contract", 2, 64, "2026-04-14", "E015", ""],
    ["E017", "Talha Saeed", "Junior developer", "Technology", 60000, "2026-09-14", "probation", 2, 61, "", "E015", ""],
    ["E018", "Iqra Farooq", "Social media executive", "Marketing", 50000, "2026-03-09", "verbal", 0, 57, "", "E009", "no_written_terms"],
    ["E019", "Owais Haider", "Sales executive", "Sales", 52000, "2025-12-01", "verbal", 0, 49, "", "E003", "no_written_terms"],
    ["E020", "Sadia Anwar", "Accounts officer", "Accounts", 65000, "2024-04-15", "permanent", 4, 73, "2026-10-02", "E008", ""],
    ["E021", "Junaid Akbar", "Motion designer", "Design", 78000, "2025-02-10", "contract", 2, 67, "2026-03-18", "E004", ""],
    ["E022", "Mehwish Latif", "Client coordinator", "Accounts", 48000, "2026-05-04", "verbal", 0, 60, "", "E008", "no_written_terms"]
  ].map(function (r) {
    var o = {};
    FIELDS.forEach(function (f, i) { o[f] = r[i]; });
    return o;
  });

  var DEFAULT_MODEL = { wContract: 45, wPerformance: 30, wTenure: 25, threshold: 55, noticeFloor: 4, reviewWindow: 6, perfFloor: 60 };
  var DEFAULT_ORG = { eobi: false, gratuity: false, harassment: false, leave: true, termination: true };

  var state = { employees: clone(SEED), org: clone(DEFAULT_ORG), asOf: "2026-11-23", source: "Fictional seeded data" };
  var model = clone(DEFAULT_MODEL);
  var view = { dept: "all", contract: "all", flagged: false, compact: false, q: "", sort: "risk_desc" };
  var selection = new Set();
  var undoStack = [];
  var savedViews = [];
  var prev = { risk: null, retention: null };
  var openId = null;
  var lastFocus = null;
  var patternSeq = 0;

  /* ---------- model ---------- */
  function tokens(e) {
    return String(e.risk_flags || "").split(";").map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function tenure(e, asOf) { return monthsBetween(e.start_date, asOf || state.asOf) || 0; }
  function reviewAge(e, asOf) { return e.last_review_date ? monthsBetween(e.last_review_date, asOf || state.asOf) : null; }

  function contractComponent(e, m, asOf) {
    var c = 0;
    if (e.contract_status === "verbal") c += 60;
    else if (e.contract_status === "probation" && tenure(e, asOf) > 3) c += 45;
    else if (e.contract_status === "contract") c += 20;
    var gap = Math.max(0, m.noticeFloor - e.notice_period_weeks);
    c += Math.min(40, gap * 12);
    return clamp(c, 0, 100);
  }
  function perfComponent(e, m) {
    return clamp(((m.perfFloor - e.performance_score) / m.perfFloor) * 100, 0, 100);
  }
  function retentionPenalty(e, m, asOf) {
    var p = 0;
    var age = reviewAge(e, asOf);
    if (age === null) p += Math.min(30, 10 + tenure(e, asOf) * 1.2);
    else p += Math.min(24, age * 1.8) + (age > m.reviewWindow ? 4 : 0);
    if (tenure(e, asOf) < 6) p += 8;
    var t = tokens(e);
    if (t.indexOf("scope_requests_unanswered") > -1) p += 14;
    if (t.indexOf("pay_flat_24m") > -1) p += 8;
    if (t.indexOf("promotion_without_criteria") > -1) p += 10;
    if (e.contract_status === "verbal") p += 6;
    return clamp(p, 0, 100);
  }
  function retentionIndex(e, m, asOf) { return clamp(100 - retentionPenalty(e, m, asOf), 0, 100); }
  function weightSum(m) { return Math.max(1, m.wContract + m.wPerformance + m.wTenure); }
  function riskOf(e, m, asOf) {
    return clamp((contractComponent(e, m, asOf) * m.wContract + perfComponent(e, m) * m.wPerformance +
      retentionPenalty(e, m, asOf) * m.wTenure) / weightSum(m), 0, 100);
  }
  function contractBreach(e, m, asOf) {
    return e.contract_status === "verbal" || e.notice_period_weeks < m.noticeFloor ||
      (e.contract_status === "probation" && tenure(e, asOf) > 3);
  }
  function perfBreach(e, m, asOf) {
    var age = reviewAge(e, asOf);
    return e.performance_score < m.perfFloor || age === null || age > m.reviewWindow;
  }
  function retentionBreach(e, m, asOf) { return retentionIndex(e, m, asOf) < 70; }

  function flagsOf(e, m) {
    var out = [];
    var age = reviewAge(e);
    if (e.contract_status === "verbal") out.push({ sev: "high", text: "No written terms of engagement. Standing Order 3 requires a written order." });
    if (e.notice_period_weeks < m.noticeFloor) out.push({ sev: "high", text: "Notice of " + e.notice_period_weeks + " week" + (e.notice_period_weeks === 1 ? "" : "s") + " sits below the " + m.noticeFloor + "-week floor set in the model." });
    if (e.contract_status === "probation" && tenure(e) > 3) out.push({ sev: "high", text: "Probation has run " + tenure(e).toFixed(1) + " months against a three-month cap. Treat as permanent and date the confirmation." });
    if (age === null) out.push({ sev: "high", text: "Never reviewed. No performance record exists for this person." });
    else if (age > m.reviewWindow) out.push({ sev: "watch", text: "Last review " + age.toFixed(1) + " months ago, beyond the " + m.reviewWindow + "-month window." });
    if (e.performance_score < m.perfFloor) out.push({ sev: "high", text: "Performance " + e.performance_score + " of 100, below the " + m.perfFloor + " floor." });
    if (retentionIndex(e, m) < 70) out.push({ sev: "watch", text: "Retention index " + Math.round(retentionIndex(e, m)) + " of 100. Book a scope and pay conversation." });
    if (tenure(e) < 6) out.push({ sev: "watch", text: "Joined " + tenure(e).toFixed(1) + " months ago. Onboarding and a 30-day check-in are still open." });
    tokens(e).forEach(function (t) {
      var known = ["no_written_terms", "short_notice", "probation_overrun"];
      if (known.indexOf(t) > -1) return;
      out.push({ sev: "watch", text: "Logged signal: " + t.replace(/_/g, " ") + "." });
    });
    if (!out.length) out.push({ sev: "ok", text: "No open flag under the current model." });
    return out;
  }

  function complianceChecks(m) {
    var verbal = state.employees.filter(function (e) { return e.contract_status === "verbal"; }).length;
    var shortNotice = state.employees.filter(function (e) { return e.contract_status === "permanent" && e.notice_period_weeks < m.noticeFloor; }).length;
    var overrun = state.employees.filter(function (e) { return e.contract_status === "probation" && tenure(e) > 3; }).length;
    return [
      { key: "terms", label: "Written terms for every person", pass: verbal === 0, locked: true, note: verbal + " verbal" },
      { key: "notice", label: "Notice floor for permanent staff", pass: shortNotice === 0, locked: true, note: shortNotice + " below floor" },
      { key: "probation", label: "Probation capped at three months", pass: overrun === 0, locked: true, note: overrun + " over-run" },
      { key: "eobi", label: "EOBI registration and contributions", pass: state.org.eobi, locked: false },
      { key: "gratuity", label: "Gratuity or approved provident fund", pass: state.org.gratuity, locked: false },
      { key: "harassment", label: "Harassment inquiry committee named", pass: state.org.harassment, locked: false },
      { key: "leave", label: "Leave and attendance record kept", pass: state.org.leave, locked: false },
      { key: "termination", label: "Written termination process", pass: state.org.termination, locked: false }
    ];
  }

  function metrics(m, asOf) {
    m = m || model; asOf = asOf || state.asOf;
    var list = state.employees, n = Math.max(1, list.length);
    var cb = 0, pb = 0, rb = 0, retSum = 0, riskSum = 0;
    list.forEach(function (e) {
      if (contractBreach(e, m, asOf)) cb++;
      if (perfBreach(e, m, asOf)) pb++;
      if (retentionBreach(e, m, asOf)) rb++;
      retSum += retentionIndex(e, m, asOf);
      riskSum += riskOf(e, m, asOf);
    });
    var score = (cb / n * 100 * m.wContract + pb / n * 100 * m.wPerformance + rb / n * 100 * m.wTenure) / weightSum(m);
    return {
      risk: Math.round(clamp(score, 0, 100)),
      retention: Math.round(retSum / n),
      meanRisk: riskSum / n,
      contractBreach: cb, perfBreach: pb, retentionBreach: rb,
      perfAlerts: list.filter(function (e) { return perfBreach(e, m, asOf); }).length,
      count: list.length
    };
  }
  function retentionSeries() {
    var out = [];
    for (var i = 5; i >= 0; i--) {
      var d = addMonths(state.asOf, -i);
      var list = state.employees, sum = 0;
      list.forEach(function (e) { sum += retentionIndex(e, model, d); });
      out.push({ date: d, label: MONTHS[toDate(d).getUTCMonth()], value: Math.round(sum / Math.max(1, list.length)) });
    }
    return out;
  }
  function riskBand(v) { return v >= model.threshold ? "high" : v >= model.threshold - 20 ? "watch" : "low"; }
  var BAND_LABEL = { high: "High", watch: "Watch", low: "Low" };

  /* ---------- undo ---------- */
  function snapshot(label) {
    undoStack.push({ label: label, data: clone({ employees: state.employees, org: state.org, asOf: state.asOf, source: state.source }) });
    if (undoStack.length > 30) undoStack.shift();
    $("undo-btn").disabled = false;
    $("undo-btn").textContent = "Undo: " + label;
  }
  function undo() {
    var last = undoStack.pop();
    if (!last) return;
    state.employees = last.data.employees;
    state.org = last.data.org;
    state.asOf = last.data.asOf;
    state.source = last.data.source;
    selection.clear();
    if (!undoStack.length) { $("undo-btn").disabled = true; $("undo-btn").textContent = "Undo last change"; }
    else { $("undo-btn").textContent = "Undo: " + undoStack[undoStack.length - 1].label; }
    refreshDepartments();
    render();
    toast("Undone: " + last.label + ".");
  }

  /* ---------- toast ---------- */
  function toast(msg, actionLabel, action) {
    var wrap = $("toast-wrap");
    var el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = '<span class="msg">' + esc(msg) + "</span>";
    if (actionLabel) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = actionLabel;
      b.addEventListener("click", function () { action(); remove(); });
      el.appendChild(b);
    }
    wrap.appendChild(el);
    requestAnimationFrame(function () { el.classList.add("is-in"); });
    var timer = setTimeout(remove, actionLabel ? 7000 : 3600);
    function remove() {
      clearTimeout(timer);
      el.classList.remove("is-in");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
    }
    while (wrap.children.length > 3) wrap.removeChild(wrap.firstChild);
  }

  /* ---------- clipboard and downloads ---------- */
  function copyText(text, okMsg) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? okMsg : "Copy blocked by the browser. Select the text and copy manually.");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
    } else fallback();
  }
  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    toast("Downloaded " + name + ".");
  }
  function csvCell(v) {
    var s = String(v == null ? "" : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(list) {
    return FIELDS.join(",") + "\n" + list.map(function (e) {
      return FIELDS.map(function (f) { return csvCell(e[f]); }).join(",");
    }).join("\n") + "\n";
  }

  /* ---------- charts ---------- */
  function barChart(rows, opts) {
    var o = opts || {};
    var rowH = 26, padTop = 6, labelW = o.labelW || 96, w = 360;
    var h = padTop * 2 + rows.length * rowH;
    var max = o.max || Math.max.apply(null, rows.map(function (r) { return r.value; })) || 1;
    var barW = w - labelW - 62;
    var s = '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" height="' + h + '" role="img" aria-label="' + esc(o.aria || "Bar chart") + '" style="display:block;overflow:visible">';
    s += "<defs>";
    rows.forEach(function (r, i) {
      var id = "pat" + (++patternSeq);
      r.pat = id;
      s += '<pattern id="' + id + '" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(' + (i * 22 % 90) + ')">' +
        '<rect width="6" height="6" fill="' + r.colour + '"/><rect width="2" height="6" fill="rgba(255,255,255,.42)"/></pattern>';
    });
    s += "</defs>";
    rows.forEach(function (r, i) {
      var y = padTop + i * rowH;
      var len = Math.max(2, (r.value / max) * barW);
      s += '<text x="0" y="' + (y + 15) + '" style="fill:var(--ink-muted);font-size:11px;font-family:var(--font-body)">' + esc(r.label) + "</text>";
      s += '<rect x="' + labelW + '" y="' + (y + 4) + '" width="' + barW + '" height="14" rx="3" style="fill:var(--surface-3)"/>';
      s += '<rect x="' + labelW + '" y="' + (y + 4) + '" width="' + len.toFixed(1) + '" height="14" rx="3" fill="url(#' + r.pat + ')" stroke="' + r.colour + '" stroke-width="1"/>';
      s += '<text x="' + (labelW + barW + 6) + '" y="' + (y + 15) + '" style="fill:var(--ink-primary);font-size:11px;font-weight:700;font-family:var(--font-mono)">' + esc(r.display) + "</text>";
    });
    return s + "</svg>";
  }

  function lineChart(series, opts) {
    var o = opts || {};
    var w = 340, h = 150, padL = 26, padR = 14, padT = 16, padB = 24;
    var vals = series.map(function (p) { return p.value; });
    var lo = Math.max(0, Math.min.apply(null, vals) - 8), hi = Math.min(100, Math.max.apply(null, vals) + 8);
    if (hi - lo < 10) { hi = Math.min(100, lo + 10); }
    var x = function (i) { return padL + i * ((w - padL - padR) / Math.max(1, series.length - 1)); };
    var y = function (v) { return padT + (1 - (v - lo) / (hi - lo)) * (h - padT - padB); };
    var id = "grad" + (++patternSeq);
    var s = '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" height="' + h + '" role="img" aria-label="' + esc(o.aria || "Trend line") + '" style="display:block">';
    s += '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#0d9488" stop-opacity=".34"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>';
    [lo, (lo + hi) / 2, hi].forEach(function (v) {
      s += '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" style="stroke:var(--border-subtle)" stroke-width="1"/>';
      s += '<text x="0" y="' + (y(v) + 3).toFixed(1) + '" style="fill:var(--ink-dim);font-size:9px;font-family:var(--font-mono)">' + Math.round(v) + "</text>";
    });
    var line = series.map(function (p, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.value).toFixed(1); }).join(" ");
    s += '<path d="' + line + " L " + x(series.length - 1).toFixed(1) + " " + (h - padB) + " L " + padL + " " + (h - padB) + ' Z" fill="url(#' + id + ')"/>';
    s += '<path d="' + line + '" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    series.forEach(function (p, i) {
      var last = i === series.length - 1;
      s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.value).toFixed(1) + '" r="' + (last ? 4 : 2.8) + '" fill="' + (last ? "#e11d48" : "#0f766e") + '" stroke="var(--surface-card)" stroke-width="1.4"/>';
      s += '<text x="' + x(i).toFixed(1) + '" y="' + (y(p.value) - 8).toFixed(1) + '" text-anchor="middle" style="fill:var(--ink-primary);font-size:9.5px;font-weight:700;font-family:var(--font-mono)">' + p.value + "</text>";
      s += '<text x="' + x(i).toFixed(1) + '" y="' + (h - 6) + '" text-anchor="middle" style="fill:var(--ink-dim);font-size:9px;font-family:var(--font-body)">' + esc(p.label) + "</text>";
    });
    return s + "</svg>";
  }

  function sparkline(series) {
    var vals = series.map(function (p) { return p.value; });
    var lo = Math.min.apply(null, vals) - 3, hi = Math.max.apply(null, vals) + 3;
    if (hi - lo < 6) hi = lo + 6;
    var pts = series.map(function (p, i) {
      return (i * (200 / Math.max(1, series.length - 1))).toFixed(1) + "," + (30 - ((p.value - lo) / (hi - lo)) * 26).toFixed(1);
    });
    var last = pts[pts.length - 1].split(",");
    return '<polyline points="' + pts.join(" ") + '" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round"/>' +

    rows.sort(function (a, b) {
      var av, bv;
      if (key === "risk") { av = a.risk; bv = b.risk; }

      else if (key === "perf") { av = a.e.performance_score; bv = b.e.performance_score; }
      else { av = a.e[key]; bv = b.e[key]; }

  /* ---------- validation ---------- */
  function validateRecord(r, ids, index) {
    var errs = [];
    var at = "Row " + (index + 1) + (r.employee_id ? " (" + r.employee_id + ")" : "") + ": ";
    if (!r.employee_id) errs.push(at + "employee_id is empty.");
    else if (ids[r.employee_id]) errs.push(at + "employee_id is duplicated.");
    if (!r.name) errs.push(at + "name is empty.");
    var salary = Number(r.salary);
    if (!isFinite(salary) || salary < 0 || Math.round(salary) !== salary) errs.push(at + "salary must be a whole number of PKR, zero or above.");
    if (!toDate(r.start_date)) errs.push(at + "start_date must be YYYY-MM-DD.");
    if (r.last_review_date && !toDate(r.last_review_date)) errs.push(at + "last_review_date must be YYYY-MM-DD or empty.");
    if (STATUSES.indexOf(r.contract_status) === -1) errs.push(at + "contract_status must be permanent, probation, contract or verbal.");
    var notice = Number(r.notice_period_weeks);
    if (!isFinite(notice) || notice < 0 || notice > 26 || Math.round(notice) !== notice) errs.push(at + "notice_period_weeks must be a whole number from 0 to 26.");
    var perf = Number(r.performance_score);
    if (!isFinite(perf) || perf < 0 || perf > 100 || Math.round(perf) !== perf) errs.push(at + "performance_score must be a whole number from 0 to 100.");
    return errs;
  }
  function parseCSV(text) {
    var rows = [], row = [], cur = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') {
          if (text[i + 1] === '"') { cur += '"'; i++; } else q = false;
        } else cur += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (c !== "\r") cur += c;
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return c.trim() !== ""; }); });
  }
  function importCSV(text) {
    var result = $("import-result");
    var rows = parseCSV(text);
    if (rows.length < 2) {
      result.setAttribute("data-state", "error");
      result.textContent = "✕ Need a header row and at least one employee row.";
      return;
    }
    var header = rows[0].map(function (h) { return h.trim(); });
    var missing = FIELDS.filter(function (f) { return header.indexOf(f) === -1; });
    if (missing.length) {
      result.setAttribute("data-state", "error");
      result.textContent = "✕ Missing columns: " + missing.join(", ") + ".";
      return;
    }
    var ids = {}, errs = [], records = [];
    rows.slice(1).forEach(function (cells, i) {
      var r = {};
      FIELDS.forEach(function (f) {
        var v = cells[header.indexOf(f)];
        r[f] = v == null ? "" : v.trim();
      });
      r.salary = r.salary === "" ? NaN : Number(r.salary);
      r.notice_period_weeks = r.notice_period_weeks === "" ? NaN : Number(r.notice_period_weeks);
      r.performance_score = r.performance_score === "" ? NaN : Number(r.performance_score);
      errs = errs.concat(validateRecord(r, ids, i));
      if (r.employee_id) ids[r.employee_id] = true;
      records.push(r);
    });
    records.forEach(function (r, i) {
      if (r.manager_id && !ids[r.manager_id]) errs.push("Row " + (i + 1) + ": manager_id " + r.manager_id + " is not an employee_id in this file.");
    });
    if (errs.length) {
      result.setAttribute("data-state", "error");
      result.innerHTML = "✕ " + errs.length + " problem" + (errs.length === 1 ? "" : "s") + ". Nothing was loaded.<br>" +
        esc(errs.slice(0, 4).join(" ")) + (errs.length > 4 ? " And " + (errs.length - 4) + " more." : "");
      return;
    }
    snapshot("CSV import");
    state.employees = records;
    state.source = "Imported CSV";
    selection.clear();
    view.dept = "all";
    refreshDepartments();
    render();
    result.setAttribute("data-state", "ok");
    result.textContent = "✓ Loaded " + records.length + " employees. All eight validation rules passed. Undo is available in the control rail.";
    toast("Loaded " + records.length + " employees from CSV.", "Undo", undo);
  }

  /* ---------- theme, nav, progress, reveal ---------- */
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("theme-toggle").setAttribute("aria-pressed", t === "dark" ? "true" : "false");
    $("theme-glyph").textContent = t === "dark" ? "◑" : "◐";
    $("theme-label").textContent = t === "dark" ? "Light" : "Dark";
    try { localStorage.setItem("emplowise-report-theme", t); } catch (e) { /* storage unavailable */ }
  }
  function bindChrome() {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
    $("theme-toggle").addEventListener("click", function () {
      applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });
    $("print-btn").addEventListener("click", function () { window.print(); });

    var navLinks = Array.prototype.slice.call(document.querySelectorAll("[data-nav]"));
    var sections = navLinks.map(function (a) { return $(a.getAttribute("data-nav")); }).filter(Boolean);
    var ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        $("progress-fill").style.width = (max > 0 ? clamp(window.scrollY / max, 0, 1) * 100 : 0) + "%";
        var headerH = document.querySelector(".site-header").getBoundingClientRect().height;
        var line = headerH + 60;
        var active = null;
        sections.forEach(function (s) { if (s.getBoundingClientRect().top <= line) active = s.id; });
        revealPass();
        navLinks.forEach(function (a) {
          if (a.getAttribute("data-nav") === active) a.setAttribute("aria-current", "true");
          else a.removeAttribute("aria-current");
        });
      });
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    onScroll();
  }

  function observeReveals() { revealPass(); }
  function revealPass() {
    var limit = window.innerHeight * 0.94;
    document.querySelectorAll(".reveal:not(.is-in)").forEach(function (n) {
      if (n.getBoundingClientRect().top < limit) n.classList.add("is-in");
    });
  }

  /* ---------- boot ---------- */
  function init() {
    try {
      var stored = localStorage.getItem("emplowise-report-views");
      if (stored) {
        var parsed = JSON.parse(stored);
        if (Array.isArray(parsed)) savedViews = parsed.slice(0, 6);
      }
    } catch (e) { savedViews = []; }

    var sa = $("select-all");
    var hit = document.createElement("label");
    hit.className = "cb-hit";
    sa.parentNode.insertBefore(hit, sa);
    hit.appendChild(sa);

    renderStaticCharts();
    renderCopy();
    renderTimeline();
    renderSchema();
    refreshDepartments();
    syncControls();
    bindControls();
    bindChrome();
    renderSavedViews();
    render();
    observeReveals(document);
    $("import-result").textContent = "Sample ready. Paste your own CSV or fill the sample, then load it.";
    window.addEventListener("beforeprint", function () {
      document.querySelectorAll(".reveal").forEach(function (n) { n.classList.add("is-in"); });
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
